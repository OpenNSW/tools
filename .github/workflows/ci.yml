name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Every top-level directory with a go.mod is a tool module. The jobs below
  # run for each one, so adding a tool needs no change here.
  modules:
    name: Find modules
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: List the tool modules
        id: find
        run: |
          dirs=$(find . -mindepth 2 -maxdepth 2 -name go.mod -printf '%h\n' | sed 's|^\./||' | sort | jq -R . | jq -cs .)
          echo "Modules: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  module:
    name: Module (${{ matrix.dir }})
    needs: modules
    if: needs.modules.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.modules.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
          cache: true

      - name: Verify go.mod
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m
          working-directory: ${{ matrix.dir }}

      - name: Verify license headers
        run: |
          go install github.com/google/addlicense@latest
          "$(go env GOPATH)/bin/addlicense" -check \
            -f ../.github/license-header.tmpl \
            $(find . -type f -name '*.go')

      - name: Run Tests (includes build)
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt sarif -out results.sarif ./...

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.39.4
        with:
          sarif_file: ${{ matrix.dir }}/results.sarif
          category: gosec-${{ matrix.dir }}
        if: always() && hashFiles(format('{0}/results.sarif', matrix.dir)) != ''

      # govulncheck checks the standard library of the Go that runs it. The
      # steps above use the version in go.mod; the scan uses the latest stable
      # Go, which releases are built with.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Vulnerability Scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Runs the Makefile in cmd.exe, as GNU make does on Windows when no sh is on
  # the PATH, so its recipes stay portable.
  windows:
    name: Make on Windows
    needs: modules
    if: needs.modules.outputs.dirs != '[]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ fromJSON(needs.modules.outputs.dirs)[0] }}/go.mod
          cache-dependency-path: '*/go.sum'
          cache: true
      - name: Install GNU make
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) { choco install make --no-progress -y }
          make --version
      - name: make tools
        run: make SHELL=cmd.exe tools
      - name: make editorconfig license-check lint tidy build test
        run: make SHELL=cmd.exe editorconfig license-check lint tidy build test

  # Checks every file against .editorconfig: final newline, line endings,
  # trailing whitespace and indent style (settings in .editorconfig-checker.json).
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install editorconfig-checker
        run: go install github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@v3.11.1
      - name: Check files against .editorconfig
        run: make editorconfig

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks dir . --redact --no-banner

  # The one check the branch ruleset requires. It fails when any job above
  # failed or was cancelled, and passes when the module jobs were skipped
  # because there are no modules.
  ci:
    name: CI
    needs: [ modules, module, windows, editorconfig, secret-scan ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the other jobs' results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
